name: Validate gateway

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd

      - name: Run filter tests
        run: python -m unittest discover -s tests -v

      - name: Validate Python and shell syntax
        run: |
          python -m py_compile lambda_firewall/lambda_function.py lambda_firewall/security_filters.py
          bash -n scripts/build_lambda.sh

      - name: Build Lambda package reproducibly
        run: bash scripts/build_lambda.sh

      - name: Validate Terraform
        run: |
          terraform -chdir=api_gateway fmt -check
          terraform -chdir=api_gateway init -backend=false -input=false
          terraform -chdir=api_gateway validate
